[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emergent-complexity"
version = "0.1.0"
description = "A JAX cellular-automata laboratory for reproducible experiments."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Emergent Complexity Lab" }]
dependencies = [
    "jax>=0.10.2,<0.12",
    "numpy>=2.4,<2.5",
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "psutil>=7,<8",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]
browser = [
    "playwright>=1.50,<2",
]

[project.scripts]
emergent-server = "emergent.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
