name: test

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install tested dependencies
        run: python -m pip install --upgrade pip && python -m pip install -c constraints.txt -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Check JavaScript syntax
        shell: bash
        run: find frontend/src -name '*.js' -print0 | xargs -0 -n1 node --check

  browser:
    name: Browser smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -c constraints.txt -e ".[dev,browser]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start the real app and run browser smoke test
        shell: bash
        run: |
          emergent-server > /tmp/emergent-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("server did not become healthy")
          PY
          python tests/browser_smoke.py --url http://127.0.0.1:8000
