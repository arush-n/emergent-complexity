name: Deploy GitHub Pages frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Configure public API endpoint
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          api_base = os.environ["PUBLIC_API_BASE"].strip().rstrip("/")
          if not api_base.startswith("https://"):
              raise SystemExit("Set the PUBLIC_API_BASE repository variable to the HTTPS Render URL.")
          Path("frontend/config.js").write_text(
              "globalThis.EMERGENT_CONFIG = "
              + json.dumps({"apiBase": api_base})
              + ";\n",
              encoding="utf-8",
          )
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
